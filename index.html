<html>
<head>
<title>my calculator</title>
<style>
body{background:#ddd;font-family:arial}
.calc{background:white;width:300px;margin:50px auto;padding:12px;border-radius:8px}
input[type=text]{width:97%;height:55px;font-size:15px;text-align:right;margin-bottom:8px}
input[type=button]{width:65px;height:42px;margin:2px;font-size:18px;border:none;border-radius:4px;background:#eee}
.yellow{background:orange}
.green{background:green;color:white}
.red{background:red;color:white}
</style>
</head>
<body>
<div class=calc>
<center>
<h3>my calculator</h3>
<input type=text id=d><br>
<input type=button value=C class=red onclick="d.value=''">
<input type=button value=X onclick="d.value=d.value.slice(0,-1)">
<input type=button value=% onclick="d.value+='%'">
<input type=button value=/ class=yellow onclick="d.value+='/'"><br>
<input type=button value=7 onclick="d.value+='7'">
<input type=button value=8 onclick="d.value+='8'">
<input type=button value=9 onclick="d.value+='9'">
<input type=button value=* class=yellow onclick="d.value+='*'"><br>
<input type=button value=4 onclick="d.value+='4'">
<input type=button value=5 onclick="d.value+='5'">
<input type=button value=6 onclick="d.value+='6'">
<input type=button value=- class=yellow onclick="d.value+='-'"><br>
<input type=button value=1 onclick="d.value+='1'">
<input type=button value=2 onclick="d.value+='2'">
<input type=button value=3 onclick="d.value+='3'">
<input type=button value=+ class=yellow onclick="d.value+='+'"><br>
<input type=button value=0 onclick="d.value+='0'">
<input type=button value=. onclick="d.value+='.'">
<input type=button value=00 onclick="d.value+='00'">
<input type=button value== class=green onclick="calc()">
</center>
</div>
<script>
function calc(){
var x = d.value
var p = x.split('+')
if(p.length == 2){
var a = parseInt(p[0])
var b = parseInt(p[1])
if(a + b < 100){
d.value = 'haha you loser cant even calculate this'
return
}
}
d.value = eval(x)
}
</script>
</body>
</html>
